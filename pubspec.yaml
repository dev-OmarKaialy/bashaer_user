name: bashaer_driving
description: "البشائر لتعليم القيادة — driving exam preparation app for Al-Bashaer Driving School."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.8
  awesome_notifications: ^0.11.0
  firebase_messaging: ^16.1.2
  flutter_secure_storage: ^10.0.0
  injectable: ^2.7.1+4
  get_it: ^9.2.1
  flutter_screenutil: ^5.9.3
  dartz: ^0.10.1
  bot_toast: ^4.1.3
  flutter_animate: ^4.5.2
  lottie: ^3.5.1
  font_awesome_flutter: ^11.0.0
  easy_localization: ^3.0.8
  dio: ^5.9.2
  logger: ^2.6.2
  flutter_bloc: ^9.1.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  freezed_annotation: ^3.1.0
  phone_parser: ^0.0.7
  country_code_picker: ^3.4.1
  android_package_installer: ^0.0.3
  firebase_analytics: ^12.3.0
  http: ^1.5.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  edge_tts: ^0.1.5
  device_info_plus: ^12.4.0
  android_id: ^0.5.2+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  injectable_generator: ^2.12.1
  mocktail: ^1.0.4
  googleapis_auth: ^2.3.4
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
  assets:
    - assets/translations/
    - assets/icons/
    - assets/lottie/
    - assets/sounds/
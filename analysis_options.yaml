include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # generated code
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/services/dependencies.config.dart

# Added on top of flutter_lints (which already enables avoid_print,
# use_build_context_synchronously, prefer_final_fields, ...). These move
# deterministic guidance out of agent instructions and into the analyzer.
linter:
  rules:
    # const / rebuild cost
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - use_colored_box
    - use_decorated_box
    # async and resource safety
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    # API clarity
    - always_declare_return_types
